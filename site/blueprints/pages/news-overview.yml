title: news-overview
icon: 📅


options:
  preview: false
  changeTemplate: false


columns:
  # main
  main:
    width: 2/3

    sections:
      drafts:
        headline: Draft
        type: pages
        status: draft
        layout: list
        template: news
        empty: No events yet
        sortBy: date_event_start desc
        info: " {{ page.title }}"
        text: " {{ page.date_event_start }}"
        image: false

      published:
        headline: Published
        type: pages
        layout: list
        status: published
        template: news
        empty: No events yet
        sortBy: date_event_start desc
        info: " {{ page.title }}"
        text: " {{ page.date_event_start }}"
        image:
          query: page.event_image.toFile
          ratio: 1/1
          cover: true
      
      content:
        type: fields

        fields:

          show_in_home:
            label: would you like this page to appear on the homepage?
            type: toggle
          home_categorie_image:
            label: image
            type: files
            query: page.images
            max: 1

  # sidebar
  sidebar:
    width: 1/3
    sections:

      # a list of files
      files:
        type: files
        headline: Files
      



